name: Release

# Semver model (simple & explicit):
#   • The root package.json `version` is the single source of truth.
#   • Every push to main checks whether a tag `v<version>` already exists.
#       - not yet tagged  -> this is a new release: build the APK, tag it,
#                            publish a GitHub Release, push the Docker image.
#       - already tagged  -> nothing to do (no version bump since last release).
#   To cut a release: `bun run bump patch|minor|major` (or edit the version),
#   commit, and merge to main. That's the whole trigger.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to decide if this version is already released

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Typecheck (release gate)
        run: bun run typecheck

      - name: Resolve version & release decision
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not plain semver (x.y.z)"; exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new — will release (versionCode $CODE)."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      # Promoted to job scope so step `if:` can test it (secrets aren't allowed in `if`).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ needs.prepare.outputs.version }} \
            -PappVersionCode=${{ needs.prepare.outputs.version_code }}

      - name: Locate & rename APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then echo "::error::no APK produced"; exit 1; fi
          OUT="phone-mcp-agent-v${{ needs.prepare.outputs.version }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Android remote-control agent APK — v${{ needs.prepare.outputs.version }}

            **Install:** sideload the APK, open it, enter your server URL + token,
            then grant Accessibility + Screen Capture (see the README setup steps).

            Server image: `ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}`

  docker:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.prepare.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
